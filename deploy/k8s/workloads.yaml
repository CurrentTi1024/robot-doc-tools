apiVersion: apps/v1
kind: Deployment
metadata:
  name: rw-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rw-api
  template:
    metadata:
      labels:
        app: rw-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.internal/robot-doc-tools:runtime
          command: [python, -m, uvicorn, 'app.api:app', '--host=0.0.0.0', '--port=8000']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: RW_RULES
              value: /etc/rw/rules/company.json
          envFrom:
            - configMapRef:
                name: rw-config
            - secretRef:
                name: rw-infrastructure
            - secretRef:
                name: rw-api-tokens
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
          livenessProbe:
            httpGet: {path: /health/live, port: http}
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: rules
              mountPath: /etc/rw/rules
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: rw-rules
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rw-document
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rw-document
  template:
    metadata:
      labels:
        app: rw-document
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: document
          image: registry.internal/robot-doc-tools:document
          command: [celery, -A, app.worker, worker, '-Q', document, '--pool=solo', '--concurrency=1', '--loglevel=INFO']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: RW_RULES
              value: /etc/rw/rules/company.json
            - name: RW_OCR_DEVICE
              value: gpu:0
            - name: RW_LAYOUT_DIR
              value: /models/layout
            - name: RW_VL_DIR
              value: /models/vl
          envFrom:
            - configMapRef:
                name: rw-config
            - secretRef:
                name: rw-infrastructure
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: rules
              mountPath: /etc/rw/rules
              readOnly: true
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: rw-rules
        - name: models
          persistentVolumeClaim:
            claimName: rw-models
---
